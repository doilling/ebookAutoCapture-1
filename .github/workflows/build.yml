name: Build Exe

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "릴리스 태그 (예: v1.0.2, 비워두면 manual-실행번호)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          } else {
            Write-Warning "requirements.txt 파일이 없습니다."
          }

          python -m pip install "pyinstaller>=6,<7"

      - name: Check source file
        shell: pwsh
        run: |
          if (-not (Test-Path "ebookAutoCapture.py")) {
            throw "ebookAutoCapture.py 파일을 찾을 수 없습니다."
          }

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --noconsole `
            --onefile `
            --name "ebookAutoCapture" `
            "ebookAutoCapture.py"

          if (-not (Test-Path "dist/ebookAutoCapture.exe")) {
            throw "EXE 생성에 실패했습니다: dist/ebookAutoCapture.exe"
          }

      - name: Set release information
        id: release_info
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_TAG)) {
            $tag = $env:INPUT_RELEASE_TAG.Trim()
          }
          else {
            $tag = "manual-$env:RUN_NUMBER"
          }

          Write-Host "Release tag: $tag"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=eBook Auto Capture $tag" >> $env:GITHUB_OUTPUT

      - name: Create Release and Upload EXE
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          target_commitish: ${{ github.sha }}
          files: dist/ebookAutoCapture.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
