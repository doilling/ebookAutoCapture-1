name: Build Exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile ebookAutoCapture.py

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $env:GITHUB_OUTPUT
      shell: bash

    - name: Create Release and Upload EXE
      uses: softprops/action-gh-release@v1
      with:
        files: dist/ebookAutoCapture.exe
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.sch-{0}', steps.date.outputs.date) }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || format('eBook Auto Capture v1.0.sch-{0}', steps.date.outputs.date) }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
