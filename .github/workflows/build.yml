name: Build Exe

on:
  push:
    tags:
      - 'v*' # v1.0, v1.0.0 같은 태그를 푸시하면 실행됩니다.
  workflow_dispatch: # Actions 탭에서 수동으로 'Run workflow' 버튼을 눌러도 실행됩니다.

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile ebookAutoCapture.py

    - name: Create Release and Upload EXE
      uses: softprops/action-gh-release@v1
      with:
        files: dist/ebookAutoCapture.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
